# Euron RAGKit: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3160   api 8160   postgres 5456   valkey 6416   floci 4616
name: ragkit

x-app-env: &app-env
  # Development mode: the local stack talks to an emulator and links to localhost, both of
  # which production refuses on purpose (Settings.production_problems).
  APP_ENV: development
  TZ: UTC
  LOG_LEVEL: ${RAGKIT_LOG_LEVEL:-info}
  LOG_FORMAT: json
  PRODUCT_NAME: ${RAGKIT_PRODUCT_NAME:-Euron RAGKit}
  DATABASE_URL: postgresql+asyncpg://ragkit:ragkit@postgres:5432/ragkit
  REDIS_URL: redis://valkey:6379/0
  SESSION_SECRET: ${RAGKIT_SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${RAGKIT_API_KEY_PEPPER:?run `make env` first}
  CORS_ORIGINS: http://localhost:${RAGKIT_WEB_PORT:-3160},http://127.0.0.1:${RAGKIT_WEB_PORT:-3160}
  WEB_URL: http://localhost:${RAGKIT_WEB_PORT:-3160}
  API_URL: http://localhost:${RAGKIT_API_PORT:-8160}
  # Model answers and model grading are optional: "none" keeps everything offline with the
  # extractive answerer and deterministic grading. For a model, set RAGKIT_LLM_PROVIDER=ollama
  # (Ollama on this machine) or openai (any OpenAI-compatible API) and RAGKIT_LLM_MODEL.
  LLM_PROVIDER: ${RAGKIT_LLM_PROVIDER:-none}
  LLM_MODEL: ${RAGKIT_LLM_MODEL:-}
  LLM_BASE_URL: ${RAGKIT_LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${RAGKIT_LLM_API_KEY:-}
  OLLAMA_URL: ${RAGKIT_OLLAMA_URL:-http://host.docker.internal:11434}
  # The URL loader refuses private addresses unless this is true (development only).
  URL_FETCH_ALLOW_PRIVATE: ${RAGKIT_URL_FETCH_ALLOW_PRIVATE:-false}

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: ragkit-api:local

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: ragkit
      POSTGRES_USER: ragkit
      POSTGRES_PASSWORD: ragkit
    ports:
      - "127.0.0.1:${RAGKIT_PG_PORT:-5456}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragkit -d ragkit"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Embedding and query caches, rate limits and signed-out sessions. No eviction policy:
  # a revoked session must never be forgotten early.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${RAGKIT_REDIS_PORT:-6416}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    <<: *api-image
    environment:
      <<: *app-env
      MIGRATE_ON_BOOT: "true"
    ports:
      - "127.0.0.1:${RAGKIT_API_PORT:-8160}:8080"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Parses documents, builds indexes and runs evaluations, taking jobs from the queue. The
  # health check reads the worker's metrics endpoint, so it reflects the worker process.
  worker:
    <<: *api-image
    command: ["python", "-m", "ragkit_server.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9160"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9160/metrics', timeout=2)
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 3
    depends_on:
      # The API applies the migrations on boot; the worker starts once they are in.
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: ragkit-web:local
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${RAGKIT_API_PORT:-8160}
      PRODUCT_NAME: ${RAGKIT_PRODUCT_NAME:-Euron RAGKit}
    ports:
      - "127.0.0.1:${RAGKIT_WEB_PORT:-3160}:8080"
    restart: unless-stopped

volumes:
  pgdata:
