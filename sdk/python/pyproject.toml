[project]
name = "euron-ragkit"
version = "0.1.0"
description = "Python SDK and CLI for Euron RAGKit: ingest, query, answer and evaluate retrieval pipelines."
readme = "README.md"
license = "MIT"
authors = [{ name = "ENGAGESPHERE TECHNOLOGY PRIVATE LIMITED" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1", "pydantic>=2.10,<3", "typer>=0.15"]

[project.scripts]
ragkit = "ragkit.cli:app"

[dependency-groups]
dev = ["pytest>=9.1", "respx>=0.23", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "C4", "RUF", "PT", "RET", "PIE", "PERF", "TID"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ragkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
