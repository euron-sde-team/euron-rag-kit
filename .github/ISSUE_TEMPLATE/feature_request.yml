name: Feature request
description: Propose a capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build or measure that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. A chunking strategy, a metric, a loader, an API shape, a configuration option or a UI sketch are all welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
